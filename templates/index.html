<form action="/refugios/agregar" method="POST">
    <input type="text" name="nombre" placeholder="Nombre del Refugio" required>
    <input type="text" name="direccion" placeholder="Dirección">
    <input type="text" name="telefono" placeholder="Teléfono">
    <input type="number" step="0.000001" name="latitud" placeholder="Latitud" required>
    <input type="number" step="0.000001" name="longitud" placeholder="Longitud" required>
    <textarea name="descripcion" placeholder="Descripción"></textarea>
    <button type="submit">Agregar Refugio</button>
</form>

<table>
    <tr>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Acciones</th>
    </tr>
    {% for refugio in refugios %}
    <tr>
        <td>{{ refugio.nombre }}</td>
        <td>{{ refugio.telefono }}</td>
        <td>
            <a href="/refugios/editar/{{ refugio.id }}">✏️</a>
            <a href="/refugios/eliminar/{{ refugio.id }}">🗑️</a>
        </td>
    </tr>
    {% endfor %}
</table>
