<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin="" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        #mapa { 
            height: 500px; 
            width: 100%;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mapa de Refugios</h1>
        <div id="mapa" style="height: 500px; width: 100%;"></div>
        <h3>Agregar Refugio</h3>
        <form method="POST" action="{{ url_for('agregar_refugio') }}">
            <input type="text" name="nombre" placeholder="Nombre" required>
            <input type="text" name="latitud" placeholder="Latitud" required>
            <input type="text" name="longitud" placeholder="Longitud" required>
            <input type="text" name="contacto" placeholder="Contacto" required>
            <input type="text" name="descripcion" placeholder="Descripción" required>
            <button type="submit">Agregar</button>
        </form>
        <a href="{{ url_for('logout') }}" class="btn-logout">Cerrar sesión</a>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>    
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>
</html>
